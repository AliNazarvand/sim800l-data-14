$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_16_board_evb"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_16_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: { type: string }
      version: { type: string }
      date: { type: string }
      page: { type: [string, "null"] }
      section: { type: [string, "null"] }
      quote: { type: [string, "null"] }
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred]
  conflicts:
    type: array
    items: { type: object }
  notes:
    type: [string, "null"]
  tags:
    type: array
    items: { type: string }
  applicable_models:
    type: array
    items: { type: string }
  created_at: { type: string }
  updated_at: { type: string }
  name: { type: string }
  connector: { type: [string, "null"] }
  pin: { type: [string, "null"] }
  function: { type: string }
  voltage: { type: [string, "null"] }