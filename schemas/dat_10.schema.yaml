$schema: "http://json-schema.org/draft-07/schema#"
title: "dat_10_gprs_data"
type: object
required: [id, category, source, source_type, confidence, status, applicable_models]
properties:
  id:
    type: string
    pattern: "^dat_10_[0-9]{4}$"
  category:
    type: string
  source:
    type: object
    required: [name, version, date]
    properties:
      name: { type: string }
      version: { type: string }
      date: { type: string }
      page: { type: [string, "null"] }
      section: { type: [string, "null"] }
      quote: { type: [string, "null"] }
  source_type:
    type: string
    enum: [primary, secondary, external]
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum: [complete, partial, unknown, inferred, blocked, deferred]
  conflicts:
    type: array
    items: { type: object }
  notes:
    type: [string, "null"]
  tags:
    type: array
    items: { type: string }
  applicable_models:
    type: array
    items: { type: string }
  created_at: { type: string }
  updated_at: { type: string }
  command: { type: string }
  syntax: { type: string }
  parameters:
    type: array
    items:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        description: { type: string }
  response: { type: string }
  examples:
    type: array
    items: { type: string }
  related_urcs:
    type: array
    items: { type: string }
  related_states:
    type: array
    items: { type: string }
  related_commands:
    type: array
    items: { type: string }